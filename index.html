        const sEl = document.getElementById('cd-s');

        if(!dEl) return;

          mEl.innerText = "00";
          sEl.innerText = "00";
          return;

        mEl.innerText = mins < 10 ? '0' + mins : mins;

          ${data.testimonials.length > 0 ? `
          <section class="max-w-4xl mx-auto px-4 py-10 sm:py-12">
            <h2 style="color: ${data.colorPrimary}" class="${headingClass} text-xl sm:text-2xl text-center mb-6 tracking-tight">${data.testimonialSectionTitle[lang] || ''}</h2>
            <div class="grid grid-cols-1 gap-3 sm:gap-4">
              ${data.testimonials.map(t => `
                <div class="bg-white p-4 sm:p-6 rounded-2xl border border-slate-100 shadow-sm flex items-start gap-3 sm:gap-4">
                  <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-emerald-50 text-emerald-600 flex-shrink-0 flex items-center justify-center font-bold text-xs sm:text-base">
                    <i class="fas fa-quote-left"></i>
                  </div>
                  <div>
                    <p class="text-xs sm:text-sm text-slate-600 italic leading-relaxed">"${t.quote[lang] || ''}"</p>
                    <span class="block text-xs font-bold text-slate-800 mt-2">${t.name} <span class="font-normal text-slate-400">(${t.role[lang] || ''})</span></span>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>` : ''}

          ${data.faqs.length > 0 ? `
          <section class="bg-slate-100 py-10 sm:py-12 border-t border-slate-200">
            <div class="max-w-3xl mx-auto px-4">
              <h2 style="color: ${data.colorPrimary}" class="${headingClass} text-xl sm:text-2xl text-center mb-6 tracking-tight">${data.faqSectionTitle[lang] || ''}</h2>
              <div class="space-y-3">
                ${data.faqs.map(f => `
                  <details class="group bg-white p-4 rounded-xl sm:rounded-2xl border border-slate-200 shadow-sm cursor-pointer">
                    <summary class="flex justify-between items-center font-bold text-xs sm:text-sm text-slate-800 select-none">
                      <span>${f.q[lang] || ''}</span>
                      <span class="transition group-open:rotate-180 text-slate-400"><i class="fas fa-chevron-down"></i></span>
                    </summary>
                    <p class="mt-3 text-xs sm:text-sm text-slate-600 leading-relaxed border-t pt-3 border-slate-100">${f.a[lang] || ''}</p>
                  </details>
                `).join('')}
              </div>
            </div>
          </section>` : ''}

          <section id="daftar-form" class="max-w-xl mx-auto px-4 py-12 sm:py-16">
            <div class="bg-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl border border-slate-100">
              <div class="text-center mb-6">
                <h2 style="color: ${data.colorPrimary}" class="${headingClass} text-xl sm:text-2xl tracking-tight">${data.formTitle[lang] || ''}</h2>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">${data.formSubtitle[lang] || ''}</p>
              </div>
              <form id="leadForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">${labels.parentName}</label>
                  <input type="text" id="parentName" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="${labels.placeholderParent}">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">${labels.childName}</label>
                    <input type="text" id="childName" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="${labels.placeholderChild}">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">${labels.childAge}</label>
                    <input type="text" id="childAge" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="${labels.placeholderAge}">
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">${labels.waNumber}</label>
                  <input type="tel" id="whatsapp" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm" placeholder="087771414812">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">${labels.selectSession}</label>
                  <select id="selectedSession" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-white">
                    ${sessionOptions}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">${labels.rsvpConfirm}</label>
                  <select id="rsvpStatus" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs sm:text-sm bg-white">
                    <option value="${labels.rsvpYes}">${labels.rsvpYes}</option>
                    <option value="${labels.rsvpNeedWA}">${labels.rsvpNeedWA}</option>
                  </select>
                </div>
                <button type="submit" id="btnSubmit" style="background-color: ${data.colorAccent}" class="w-full text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg transition text-xs sm:text-sm tracking-wide">
                  ${data.btnPrimaryText[lang] || ''}
                </button>
              </form>
              <div id="statusMsg" class="hidden mt-3 p-3 rounded-xl text-center text-xs font-semibold"></div>
            </div>
          </section>

          <footer style="background-color: ${data.colorFooter || '#0f172a'}" class="text-white py-8 px-4 text-center text-xs text-slate-400">
            <p class="${headingClass} text-white text-sm mb-1">${data.schoolName}</p>
            <p class="max-w-md mx-auto mb-4">${data.footerAddress[lang] || ''}</p>
            <p>© 2026 ${data.schoolName}. All rights reserved.</p>
          </footer>

          <a href="https://wa.me/${data.whatsapp}?text=Halo%20Admin%20Sekolah%20Athalia" target="_blank" class="fixed bottom-5 right-5 bg-emerald-500 hover:bg-emerald-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center text-2xl z-40">
            <i class="fab fa-whatsapp"></i>
          </a>
        </div>
      `;

      const form = document.getElementById('leadForm');
      if(form) {
        form.addEventListener('submit', e => {
          e.preventDefault();
          const btn = document.getElementById('btnSubmit');
          const msg = document.getElementById('statusMsg');
          btn.disabled = true;
          btn.innerText = 'Sending...';

          const payload = {
            parentName: document.getElementById('parentName').value,
            childName: document.getElementById('childName').value,
            childAge: document.getElementById('childAge').value,
            whatsapp: document.getElementById('whatsapp').value,
            selectedSession: document.getElementById('selectedSession').value,
            rsvpStatus: document.getElementById('rsvpStatus').value
          };

          const waText = `Halo Admin ${data.schoolName}, pendaftaran Event:\n- Nama Ortu: ${payload.parentName}\n- Nama Anak: ${payload.childName} (${payload.childAge})\n- Sesi: ${payload.selectedSession}\n- RSVP: ${payload.rsvpStatus}`;

          if(!data.scriptUrl) {
            window.open(`https://wa.me/${data.whatsapp}?text=${encodeURIComponent(waText)}`, '_blank');
            btn.disabled = false;
            btn.innerText = data.btnPrimaryText[lang];
            return;
          }

          fetch(data.scriptUrl, { method: 'POST', body: JSON.stringify(payload) })
          .then(res => {
            btn.disabled = false;
            btn.innerText = data.btnPrimaryText[lang];
            msg.className = "mt-3 p-3 rounded-xl text-center text-xs font-semibold bg-emerald-100 text-emerald-800";
            msg.innerText = lang === 'id' ? "Pendaftaran Berhasil!" : "Registration Successful!";
            form.reset();
          })
          .catch(err => {
            btn.disabled = false;
            btn.innerText = data.btnPrimaryText[lang];
            window.open(`https://wa.me/${data.whatsapp}?text=${encodeURIComponent(waText)}`, '_blank');
          });
        });
      }
    }

    renderPage();
    startTimer();
  </script>
</body>
</html>
